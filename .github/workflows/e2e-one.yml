name: Run one e2e spec (manual)

on:
  workflow_dispatch:
    inputs:
      spec: { description: "spec file, e.g. e2e/daily.spec.ts", required: true }
      project: { description: "Playwright project", required: false, default: "desktop" }

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_USER2_EMAIL: ${{ secrets.E2E_USER2_EMAIL }}
      E2E_USER2_PASSWORD: ${{ secrets.E2E_USER2_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx vite build --outDir dist-e2e
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test ${{ inputs.spec }} --project=${{ inputs.project }} --retries=0
